<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>淨律寺平鎮兒童讀經班｜課程試算</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4eb;color:#35463d;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 12px}header{text-align:center;padding:28px 10px;border-bottom:2px solid #b99b65}h1{font-size:clamp(22px,4vw,34px);margin:8px}h2{font-size:20px}small{color:#66766b}.panel{background:white;border:1px solid #e3dccb;border-radius:14px;padding:16px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#edf1e9;border-radius:10px;padding:12px;text-align:center}.stat strong{display:block;font-size:clamp(18px,3vw,28px)}.bad{color:#b33b30}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 7px;border-bottom:1px solid #e8e5dc;text-align:left;white-space:nowrap}th{background:#edf1e9}input{width:76px;padding:7px;border:1px solid #b9c3b8;border-radius:6px;font:inherit}button{background:#496b58;color:white;border:0;border-radius:8px;padding:10px 15px;font:inherit;cursor:pointer;margin:4px}button.alt{background:#a18550}.bar{display:flex;height:18px;border-radius:9px;overflow:hidden;background:#eee}.bar span{transition:width .2s}.group td{background:#f2ead8;font-weight:bold}footer{text-align:center;color:#66766b;padding:15px}@media print{body{background:white}main{padding:0}button,.no-print{display:none} .panel{border:0;padding:0}input{border:0;padding:0;width:55px}tr{break-inside:avoid}header{padding:0} .scroll{overflow:visible}}</style></head><body><main><header><div style="font-size:32px;color:#a18550">❋</div><small>淨律寺平鎮兒童讀經班</small><h1>善種子培訓・課程時間試算</h1>禮佛養恭敬・念佛養專注・經典養智慧・孝親養品德</header><section class="panel"><div class="stats"><div class="stat">目標時間<strong>90分鐘</strong></div><div class="stat">目前總時間<strong id="total"></strong></div><div class="stat"><span id="status"></span><strong id="remaining"></strong></div></div><p id="summary"></p><div class="bar" id="bar"></div><small>金色：佛學　綠色：弟子規　紫色：圓滿儀軌　灰色：剩餘時間</small></section><section class="panel"><h2>課程流程與遍數設定</h2><p class="no-print">可修改每單位秒數及遍數／分鐘數，時間即時更新。預設緩衝已納入各階段。</p><div class="scroll"><table><thead><tr><th>課程內容</th><th>單位秒數</th><th>數量</th><th>單位</th><th>小計</th><th>累計時間</th></tr></thead><tbody id="rows"></tbody></table></div><div class="no-print"><button onclick="save()">儲存設定</button><button class="alt" onclick="reset()">恢復預設</button><button onclick="window.print()">列印／另存 PDF</button><button onclick="copyPlan()">複製課程表</button><span id="msg" role="status"></span></div></section><footer>固定儀軌建立規律・變化教學維持興趣・生活實踐培養品德<br><small>開場拜佛及讚佛後念佛為暫定配置，正式儀軌請師父確認。</small></footer></main><script>
const defaults=[['開場整隊、合掌、拜佛',60,3,'分鐘',0],['開場念佛',4,108,'聲',0],['阿彌陀經',486,1,'遍',0],['往生咒（第一次）',16,3,'遍',0],['大悲咒／心經',120,1,'遍',0],['往生咒（第二次）',16,3,'遍',0],['七佛滅罪真言',8,21,'遍',0],['虛空藏菩薩咒',12,7,'遍',0],['讚佛偈',90,1,'遍',0],['讚佛後念佛',4,21,'聲',0],['木魚念佛定性遊戲',60,11,'分鐘',0],['經文銜接及靜心轉場',1,240,'秒',0],['喝水、如廁、休息',60,3,'分鐘',1],['弟子規經文誦讀',60,5,'分鐘',1],['白話講解',60,7,'分鐘',1],['佛學／孝親故事',60,8,'分鐘',1],['品德遊戲與角色扮演',60,10,'分鐘',1],['善種子生活任務',60,4,'分鐘',1],['今日重點複習',60,2,'分鐘',1],['百字明咒補闕',45,3,'遍',2],['迴向偈',15,1,'遍',2],['三皈依、拜佛',120,1,'次',2],['班歌',60,1,'遍',2],['感恩師長、互道再見',30,1,'次',2]];
// Exact first-stage buffer derived from the 45-minute target.
defaults[11][2]=2700-defaults.slice(0,11).reduce((s,r)=>s+r[1]*r[2],0);
let data=structuredClone(defaults);try{let x=JSON.parse(localStorage.getItem('seed-class-v1'));if(Array.isArray(x)&&x.length===defaults.length)data=defaults.map((r,i)=>[r[0],Math.max(0,Number(x[i][1])||0),Math.max(0,Number(x[i][2])||0),r[3],r[4]])}catch(e){}const names=['第一階段｜佛學念佛定性','第二階段｜弟子規品德教育','第三階段｜補闕迴向及班歌'];const fmt=s=>`${Math.floor(s/60)}分${String(s%60).padStart(2,'0')}秒`;const clock=s=>[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');function render(){document.getElementById('rows').innerHTML=data.map((r,i)=>(i===0||data[i-1][4]!==r[4]?`<tr class="group"><td colspan="6">${names[r[4]]} <span id="g${r[4]}"></span></td></tr>`:'')+`<tr><td>${r[0]}</td><td><input aria-label="${r[0]}單位秒數" type="number" min="0" step="1" value="${r[1]}" oninput="change(${i},1,this)"></td><td><input aria-label="${r[0]}數量" type="number" min="0" step="1" value="${r[2]}" oninput="change(${i},2,this)"></td><td>${r[3]}</td><td id="s${i}"></td><td id="t${i}"></td></tr>`).join('');calc()}function change(i,j,el){data[i][j]=Math.max(0,Math.floor(Number(el.value)||0));calc()}function calc(){let t=0,g=[0,0,0];data.forEach((r,i)=>{let s=r[1]*r[2];g[r[4]]+=s;document.getElementById('s'+i).textContent=fmt(s);document.getElementById('t'+i).textContent=clock(t)+'–'+clock(t+s);t+=s});g.forEach((s,i)=>document.getElementById('g'+i).textContent='（'+fmt(s)+'）');document.getElementById('total').textContent=fmt(t);document.getElementById('status').textContent=t>5400?'超出時間':t===5400?'準時完成':'剩餘時間';let rem=document.getElementById('remaining');rem.textContent=fmt(Math.abs(5400-t));rem.className=t>5400?'bad':'';document.getElementById('summary').textContent=g.map((s,i)=>['佛學','弟子規','圓滿'][i]+' '+fmt(s)).join(' ｜ ');document.getElementById('bar').innerHTML=g.map((s,i)=>`<span style="width:${s/Math.max(t,5400)*100}%;background:${['#b99b65','#739486','#9297b3'][i]}"></span>`).join('')}
function save(){try{localStorage.setItem('seed-class-v1',JSON.stringify(data));msg.textContent='已儲存於此瀏覽器'}catch(e){msg.textContent='瀏覽器不允許儲存'}}function reset(){data=structuredClone(defaults);render();save()}async function copyPlan(){let t=0;let out=data.map(r=>{let s=r[1]*r[2],line=clock(t)+'–'+clock(t+s)+' '+r[0]+' '+r[2]+r[3]+' '+fmt(s);t+=s;return line}).join('\n')+'\n總時間：'+fmt(t);try{await navigator.clipboard.writeText(out);msg.textContent='已複製'}catch(e){let a=document.createElement('textarea');a.value=out;document.body.append(a);a.select();let ok=document.execCommand('copy');a.remove();msg.textContent=ok?'已複製':'無法複製，請使用列印功能'}}render();</script></body></html>
